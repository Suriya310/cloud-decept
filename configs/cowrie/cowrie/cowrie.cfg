[server]
# Server settings
ssh_version = SSH-2.0-OpenSSH_8.9p1 Ubuntu-3ubuntu0.1
hostname = ubuntu-server
fs_root = /cowrie/honeypot

# Authentication
auth_class = cowrie.ssh.auth.Auth
auth_publickey = false
auth_password = true

# Interactive
shell = /bin/bash
interactive = true
login_prompt = login:
password_prompt = Password:

# Logging
log_path = /cowrie/var/log/cowrie/
log_level = INFO
log_format = %(asctime)s %(levelname)s %(message)s

# Output
output_path = /cowrie/var/log/cowrie/
output_enabled = true

# Download
download_path = /cowrie/var/lib/cowrie/downloads/
download_limit_size = 10485760

# Telnet (disabled)
telnet_enabled = false

# Proxy
proxy_enabled = false

[output_jsonlog]
# JSON logging for ingestion
enabled = true
log_path = /cowrie/var/log/cowrie/cowrie.json

[ssh]
# SSH settings
listen_endpoints = tcp:2222:interface=0.0.0.0
rsa_key_file = /cowrie/etc/ssh_host_rsa_key
dsa_key_file = /cowrie/etc/ssh_host_dsa_key
ecdsa_key_file = /cowrie/etc/ssh_host_ecdsa_key
ed25519_key_file = /cowrie/etc/ssh_host_ed25519_key

# KEX algorithms
kex = curve25519-sha256,curve25519-sha256@libssh.org,diffie-hellman-group-exchange-sha256,diffie-hellman-group16-sha512,diffie-hellman-group18-sha512,diffie-hellman-group14-sha256

# Ciphers
ciphers = chacha20-poly1305@openssh.com,aes256-gcm@openssh.com,aes128-gcm@openssh.com,aes256-ctr,aes192-ctr,aes128-ctr

# MACs
macs = hmac-sha2-256,hmac-sha2-512,hmac-sha1

# Compression
compression = zlib@openssh.com,zlib

# Server host key algorithms
server_host_key_algorithms = ssh-ed25519,rsa-sha2-256,rsa-sha2-512,ssh-rsa,ecdsa-sha2-nistp256,ecdsa-sha2-nistp384,ecdsa-sha2-nistp521

# Password auth
auth_password = true
auth_publickey = false

# Session
session_timeout = 3600
channel_timeout = 300

# Fake environment
fake_addr = 10.0.0.100
fake_port = 22

[honeypot]
# Honeypot settings
hostname = ubuntu-server
fake_filesystem = true
fake_filesystem_path = /cowrie/var/lib/cowrie/fs.pkl

# User database
userdb = /cowrie/etc/userdb.txt

# Commands
command_timeout = 300
command_max_output = 1048576

# Environment
env = TERM=xterm-256color,PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin,HOSTNAME=ubuntu-server

# Cloud command interception (new architecture)
event_collector_url = http://event-collector:8000
cloud_api_mock_url = http://cloud-api-mock:8080
adaptive_engine_url = http://adaptive-engine:8002
llm_gateway_url = http://llm-gateway:8003

[shell]
# Shell settings
prompt = $
prompt_root = #
home_dir = /home/ubuntu

# History
history_size = 1000
history_file = ~/.bash_history

# Aliases
alias_ls = ls --color=auto
alias_ll = ls -la
alias_grep = grep --color=auto

# Cloud CLI commands (add to PATH via custom shell)
command_aws = cowrie.commands.aws:CommandAWS
command_az = cowrie.commands.azure:CommandAZ
command_gcloud = cowrie.commands.gcp:CommandGCLOUD

[filesystem]
# Fake filesystem
enabled = true
path = /cowrie/var/lib/cowrie/fs.pkl

# Pre-populate with cloud-like files
create_cloud_files = true

[network]
# Network simulation
enabled = true
fake_ip = 10.0.0.100
fake_gateway = 10.0.0.1
fake_dns = 10.0.0.2

# Simulated interfaces
interfaces = eth0,lo

# Routing
default_route = 10.0.0.1

[intelligence]
# Threat intelligence
enabled = true

# MITRE ATT&CK mapping
mitre_mapping_enabled = true

# IOC extraction
ioc_extraction_enabled = true

# Session summarization
summarization_enabled = true