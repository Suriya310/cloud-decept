# CloudDecept Oracle Cloud Free Tier Override (2 OCPU / 12 GB RAM / ARM64)
# Usage: docker compose -f docker-compose.yml -f docker-compose.oracle.yml up -d
# This file ONLY adds resource constraints. Base config remains in docker-compose.yml

version: '3.8'

services:
  # ============================================================
  # STAGE 1: DATABASES (Start first)
  # ============================================================
  clickhouse:
    mem_limit: 2g
    memswap_limit: 2g
    cpus: '0.5'
    environment:
      - CLICKHOUSE_DB=deception
      - CLICKHOUSE_USER=deception
      - CLICKHOUSE_PASSWORD=changeme_production_password
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    command: >
      --max_memory_usage=1000000000
      --max_memory_usage_for_user=2000000000
      --max_part_size_to_merge=1000000000
      --max_bytes_to_merge_at_max_space_in_pool=1000000000

  postgres:
    mem_limit: 512m
    memswap_limit: 512m
    cpus: '0.25'
    environment:
      - POSTGRES_DB=deception
      - POSTGRES_USER=deception
      - POSTGRES_PASSWORD=changeme_production_password
      - POSTGRES_SHARED_BUFFERS=128MB
      - POSTGRES_WORK_MEM=4MB
      - POSTGRES_MAINTENANCE_WORK_MEM=64MB
      - POSTGRES_EFFECTIVE_CACHE_SIZE=1GB
    command: >
      -c shared_buffers=128MB
      -c work_mem=4MB
      -c maintenance_work_mem=64MB
      -c effective_cache_size=1GB
      -c max_connections=100
      -c random_page_cost=1.1

  redis:
    mem_limit: 256m
    memswap_limit: 256m
    cpus: '0.1'
    command: >
      --maxmemory 200mb
      --maxmemory-policy allkeys-lru
      --save ""
      --appendonly no

  # ============================================================
  # STAGE 2: BACKEND SERVICES (Start after DBs healthy)
  # ============================================================
  event-collector:
    mem_limit: 256m
    memswap_limit: 256m
    cpus: '0.25'
    restart: unless-stopped

  llm-gateway:
    mem_limit: 384m
    memswap_limit: 384m
    cpus: '0.25'
    environment:
      - OLLAMA_URL=http://ollama:11434
      - LLM_PROVIDER=ollama
    restart: unless-stopped
    depends_on:
      ollama:
        condition: service_healthy

  backend-api:
    mem_limit: 384m
    memswap_limit: 384m
    cpus: '0.25'
    restart: unless-stopped

  # ============================================================
  # STAGE 2: HONEYPOT & API SERVICES
  # ============================================================
  cowrie-ssh:
    mem_limit: 256m
    memswap_limit: 256m
    cpus: '0.1'
    restart: unless-stopped

  cloud-api-mock:
    mem_limit: 384m
    memswap_limit: 384m
    cpus: '0.25'
    environment:
      - WORKERS=2
      - UVICORN_WORKERS=2
    restart: unless-stopped

  # ============================================================
  # STAGE 3: AI SERVICES (Start after infra stable)
  # ============================================================
  ollama:
    mem_limit: 4g
    memswap_limit: 4g
    cpus: '1.0'
    environment:
      - OLLAMA_HOST=0.0.0.0
      - OLLAMA_NUM_PARALLEL=1
      - OLLAMA_MAX_LOADED_MODELS=1
      - OLLAMA_KEEP_ALIVE=10m
    restart: unless-stopped

  intent-engine:
    mem_limit: 384m
    memswap_limit: 384m
    cpus: '0.25'
    environment:
      - LLM_GATEWAY_URL=http://llm-gateway:8003
      - OLLAMA_MODEL=llama3.2:3b
      - OLLAMA_HOST=http://ollama:11434
      - INTENT_CONFIDENCE_THRESHOLD=0.7
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    depends_on:
      ollama:
        condition: service_healthy

  adaptive-engine:
    mem_limit: 256m
    memswap_limit: 256m
    cpus: '0.25'
    restart: unless-stopped

  threat-intel:
    mem_limit: 384m
    memswap_limit: 384m
    cpus: '0.25'
    environment:
      - OLLAMA_MODEL=llama3.2:3b
      - OLLAMA_HOST=http://ollama:11434
      - SUMMARIZER_MAX_TOKENS=512
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    depends_on:
      ollama:
        condition: service_healthy

  # ============================================================
  # STAGE 4: DASHBOARD (Start after APIs healthy)
  # ============================================================
  dashboard:
    mem_limit: 256m
    memswap_limit: 256m
    cpus: '0.25'
    restart: unless-stopped